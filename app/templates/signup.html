<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">
    <title>Sign up | DealSignal</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #f6f8fa;
            color: #1c2128;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 20px 0;
        }

        .logo {
            font-weight: 800;
            color: #14273d;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.03em;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #14273d;
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.05em;
            line-height: 1;
        }

        .logo strong {
            font-size: 1.15rem;
            letter-spacing: -0.04em;
        }

        .top a.back {
            color: #5a6472;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
        }

        .top a.back:hover {
            color: #14273d;
        }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px 64px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #e2e8ee;
            border-radius: 12px;
            padding: 36px 32px;
        }

        .card h1 {
            font-size: 1.45rem;
            color: #14273d;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #5a6472;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #14273d;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: #f6f8fa;
            border: 1px solid #cdd6dd;
            border-radius: 8px;
            padding: 12px 14px;
            color: #1c2128;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }

        .form-input:focus {
            background: #fff;
            border-color: #14273d;
        }

        .btn {
            width: 100%;
            background: #14273d;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.98rem;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn:hover {
            background: #1c3228;
        }

        .alert {
            background: #eef4fa;
            border: 1px solid #c5d4e4;
            color: #14273d;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 18px;
            text-align: left;
            line-height: 1.5;
        }

        .alert.error {
            background: #fdeaea;
            border-color: #eec3c3;
            color: #991b1b;
        }

        .footer-link {
            margin-top: 22px;
            text-align: center;
            font-size: 0.88rem;
            color: #5a6472;
        }

        .footer-link a {
            color: #1e5c3a;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="top">
        <a class="logo" href="/">
            <svg width="30" height="30" viewBox="0 0 32 32" style="border-radius:6px; overflow:hidden;" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="header-logo-grad-signup" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#14273d" />
                        <stop offset="100%" stop-color="#1e5c3a" />
                    </linearGradient>
                </defs>
                <rect width="32" height="32" fill="url(#header-logo-grad-signup)" />
                <path d="M10 8h5.5a8 8 0 0 1 8 8v0a8 8 0 0 1-8 8H10V8z" stroke="#ffffff" stroke-width="2.2"
                    stroke-linejoin="round" />
                <line x1="13" y1="12" x2="13" y2="20" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
                <path d="M16 13a3 3 0 0 1 3 3v0a3 3 0 0 1-3 3" stroke="#ffffff" stroke-width="1.8"
                    stroke-linecap="round" stroke-dasharray="1 1" opacity="0.8" />
                <path d="M16 11a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5" stroke="#ffffff" stroke-width="1.5"
                    stroke-linecap="round" opacity="0.5" />
            </svg>
            <strong style="margin-left: 2px;">DealSignal</strong>
        </a>
        <a class="back" href="/">← Back to home</a>
    </div>
    <div class="main">
        <div class="card">
            <h1>Create account</h1>
            <p class="subtitle">Enter your details below. Then use the same email and password on the Login page.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
            <div class="alert {% if cat == 'error' %}error{% endif %}">{{ msg }}</div>
            {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('main.signup') }}">
                <div class="form-group">
                    <label class="form-label" for="name">Full name</label>
                    <input class="form-input" type="text" id="name" name="name" placeholder="Your name" required
                        autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" type="email" id="email" name="email" placeholder="you@example.com"
                        required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" name="password"
                        placeholder="At least 8 characters" minlength="8" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm password</label>
                    <input class="form-input" type="password" id="confirm_password" name="confirm_password"
                        placeholder="Repeat password" minlength="8" required>
                </div>
                <button class="btn" type="submit">Create account</button>
            </form>

            <div class="footer-link">
                Already have an account? <a href="{{ url_for('main.login') }}">Login</a>
            </div>
        </div>
    </div>
</body>

</html>
